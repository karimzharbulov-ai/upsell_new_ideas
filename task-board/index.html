<title>Доска Карима</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: колонки-списки на цветном поле доски, как в Trello; сверху — строка «накидай словами» и фильтр по фокусам */
:root {
  --board: #1f4a5c;
  --board-2: #275a6f;
  --board-fg: #f0f6f8;
  --board-muted: #b9d0d9;
  --col: #e9eef1;
  --card: #ffffff;
  --fg: #172630;
  --muted: #5d717c;
  --line: #d3dde2;
  --accent: #f2b134;
  --accent-fg: #1d1606;
  --hi: #d6463f;
  --med: #d98f1f;
  --low: #7d929c;
  --ok: #2e9b66;
  --scrim: rgba(10, 22, 28, .55);
  --shadow: 0 1px 0 rgba(23,38,48,.12), 0 1px 3px rgba(23,38,48,.08);
  --f-display: "Unbounded", "Onest", system-ui, sans-serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --board: #0e1b22; --board-2: #15262f; --board-fg: #e6eef2; --board-muted: #8ea6b1;
  --col: #18272f; --card: #22343e; --fg: #e3ecf0; --muted: #94a9b3; --line: #2f4450;
  --accent: #f2b134; --accent-fg: #1d1606; --low: #7f959f; --scrim: rgba(0,0,0,.6);
  --shadow: 0 1px 0 rgba(0,0,0,.35); color-scheme: dark } }
:root[data-theme="dark"] {
  --board: #0e1b22; --board-2: #15262f; --board-fg: #e6eef2; --board-muted: #8ea6b1;
  --col: #18272f; --card: #22343e; --fg: #e3ecf0; --muted: #94a9b3; --line: #2f4450;
  --accent: #f2b134; --accent-fg: #1d1606; --low: #7f959f; --scrim: rgba(0,0,0,.6);
  --shadow: 0 1px 0 rgba(0,0,0,.35); color-scheme: dark }

html, body { min-height: 100% }
body { background: var(--board); color: var(--board-fg); font-family: var(--f-body); font-size: 14px; line-height: 1.4 }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 28px; display: grid; gap: 16px }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -.01em; margin: 0; text-wrap: balance }
.sub { color: var(--board-muted); font-size: 13px; font-variant-numeric: tabular-nums }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap }
.btn { border: 0; border-radius: 6px; padding: 8px 12px; font-weight: 600; font-size: 13px; background: rgba(255,255,255,.14); color: var(--board-fg); display: inline-flex; align-items: center; gap: 6px }
.btn:hover { background: rgba(255,255,255,.22) }
.btn.primary { background: var(--accent); color: var(--accent-fg) }
.btn.primary:hover { filter: brightness(1.06) }
.btn:disabled { opacity: .55; cursor: default }

/* composer */
.composer { background: var(--board-2); border-radius: 10px; padding: 12px; display: grid; gap: 8px }
.composer label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--board-muted); font-weight: 600 }
.composer textarea { width: 100%; box-sizing: border-box; min-height: 64px; resize: vertical; border-radius: 8px; border: 1px solid transparent; background: var(--card); color: var(--fg); padding: 10px 12px; line-height: 1.45 }
.composer-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.hint { color: var(--board-muted); font-size: 12px; flex: 1; min-width: 200px }
.status { font-size: 12px; color: var(--board-muted); font-family: var(--f-mono) }

/* preview tray */
.tray { background: var(--col); color: var(--fg); border-radius: 10px; padding: 12px; display: grid; gap: 10px }
.tray h2 { margin: 0; font-size: 14px; font-weight: 700 }
.tray-list { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)) }
.tray-item { background: var(--card); border-radius: 8px; padding: 8px 10px; box-shadow: var(--shadow); display: grid; gap: 4px; min-width: 0; position: relative }
.tray-item .x { position: absolute; top: 4px; right: 4px; border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; padding: 4px 6px }
.tray-item .t { font-weight: 600; padding-right: 20px }
.tray-item .m { font-size: 12px; color: var(--muted) }

/* filters */
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.chip { border: 0; border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,.12); color: var(--board-fg); display: inline-flex; align-items: center; gap: 6px }
.chip .dot { width: 8px; height: 8px; border-radius: 50% }
.chip .n { font-family: var(--f-mono); font-weight: 400; opacity: .8 }
.chip[aria-pressed="true"] { background: var(--board-fg); color: var(--board) }

/* board */
.board { display: flex; gap: 12px; overflow-x: auto; align-items: flex-start; padding-bottom: 8px; scroll-snap-type: x proximity }
.col { background: var(--col); color: var(--fg); border-radius: 10px; flex: 0 0 280px; max-width: 86vw; display: flex; flex-direction: column; max-height: calc(100vh - 120px); scroll-snap-align: start }
.col-head { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 12px 6px; gap: 8px }
.col-head h3 { margin: 0; font-size: 14px; font-weight: 700 }
.col-head .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted) }
.col-body { padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 40px }
.col.drop .col-body { background: rgba(242,177,52,.14); border-radius: 8px }
.col-add { border: 0; background: none; color: var(--muted); text-align: left; padding: 8px 12px 10px; font-size: 13px; border-radius: 0 0 10px 10px }
.col-add:hover { background: rgba(127,146,156,.12); color: var(--fg) }
.empty { color: var(--muted); font-size: 12.5px; padding: 6px 4px }

.card { background: var(--card); border-radius: 8px; box-shadow: var(--shadow); padding: 8px 10px; display: grid; gap: 6px; cursor: pointer; border: 1px solid transparent; text-align: left; width: 100%; box-sizing: border-box; min-width: 0 }
.card:hover { border-color: var(--line) }
.card.dragging { opacity: .4 }
.card.over { box-shadow: 0 -3px 0 var(--accent), var(--shadow) }
.labels { display: flex; gap: 4px; flex-wrap: wrap }
.label { font-size: 11px; font-weight: 600; color: #fff; border-radius: 4px; padding: 1px 7px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.card .title { font-weight: 500; overflow-wrap: anywhere }
.card.done .title { text-decoration: line-through; color: var(--muted) }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--muted) }
.prio { display: inline-flex; align-items: center; gap: 4px; font-weight: 600 }
.prio i { width: 8px; height: 8px; border-radius: 2px; display: inline-block }
.tag { font-family: var(--f-mono); font-size: 11px; background: rgba(127,146,156,.16); border-radius: 4px; padding: 0 5px }
.src { font-family: var(--f-mono); font-size: 11px }

/* banner */
.banner { background: var(--col); color: var(--fg); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 12px; font-size: 13px }

/* modal */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: start center; padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px)); overflow-y: auto; z-index: 20 }
.modal { background: var(--col); color: var(--fg); border-radius: 12px; width: min(560px, 100%); padding: 16px; display: grid; gap: 12px; box-sizing: border-box }
.modal h2 { margin: 0; font-family: var(--f-display); font-size: 15px; font-weight: 500 }
.field { display: grid; gap: 4px; min-width: 0 }
.field > span { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600 }
.field input, .field select, .field textarea { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; box-sizing: border-box }
.field textarea { min-height: 90px; resize: vertical }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.modal-actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap }
.modal .btn { background: rgba(127,146,156,.18); color: var(--fg) }
.modal .btn.primary { background: var(--accent); color: var(--accent-fg) }
.modal .btn.danger { background: transparent; color: var(--hi) }
.modal .btn.danger.armed { background: var(--hi); color: #fff }
.src-line { font-size: 12px; color: var(--muted); font-family: var(--f-mono) }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--card); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 30; max-width: calc(100% - 32px) }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .12s } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Доска Карима</h1>
      <div class="sub" id="sub">Загружаю задачи…</div>
    </div>
    <div class="top-actions">
      <button class="btn" id="syncBtn" type="button" title="Прочитать новые сообщения, которые ты отправлял Claude в Slack">↻ Подтянуть из Slack</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="composer" aria-labelledby="composerLabel">
    <label id="composerLabel" for="dump">Накидай задачи словами</label>
    <textarea id="dump" placeholder="например: завтра скинуть цифры в дайджест, ТП до сих пор не работает — пнуть Ису, и почитать про курсив"></textarea>
    <div class="composer-row">
      <span class="hint">Claude разобьёт текст на задачи, разложит по фокусам и колонкам. Перед добавлением покажу, что получилось. ⌘/Ctrl + Enter — разобрать.</span>
      <span class="status" id="status"></span>
      <button class="btn primary" id="parseBtn" type="button">Разобрать</button>
    </div>
  </section>

  <section class="tray" id="tray" hidden aria-live="polite">
    <div class="composer-row">
      <h2 id="trayTitle">Вот что получилось</h2>
      <span class="hint" style="color:var(--muted)">Убери лишнее крестиком — остальное уйдёт на доску.</span>
      <button class="btn" id="trayCancel" type="button" style="background:rgba(127,146,156,.18);color:var(--fg)">Отмена</button>
      <button class="btn primary" id="trayAdd" type="button">Добавить</button>
    </div>
    <div class="tray-list" id="trayList"></div>
  </section>

  <nav class="filters" id="filters" aria-label="Фокусы"></nav>

  <main class="board" id="board"></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const COLS = [
    { id: 'inbox', name: 'Входящие' },
    { id: 'today', name: 'Сегодня' },
    { id: 'doing', name: 'В работе' },
    { id: 'waiting', name: 'Ждёт других' },
    { id: 'done', name: 'Готово' },
  ];
  const COLORS = ['#c8752a', '#2f7fd0', '#7a5cd6', '#2e9b66', '#c4486a', '#7f8a1f', '#2c95a8', '#a35a3a'];
  const PRIO = { high: ['Высокий', 'var(--hi)'], med: ['Средний', 'var(--med)'], low: ['Низкий', 'var(--low)'] };
  const PRIO_RANK = { high: 0, med: 1, low: 2 };
  const SLACK_SERVER = 'Claude Code Remote';

  const S = { tasks: [], focuses: [], filter: 'all', db: null, sample: null, preview: [], previewSessions: [], loaded: { tasks: false, focuses: false }, busy: false };
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v;
      else if (k === 'style') n.setAttribute('style', v);
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) n.append(k.nodeType ? k : String(k));
    return n;
  };
  const today = () => new Date().toISOString().slice(0, 10);
  const fmtDate = (s) => { try { return new Date(s + 'T00:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }); } catch { return s; } };
  const focusById = (id) => S.focuses.find((f) => f.id === id);
  const uid = (p) => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600);
  }
  function banner(msg) { const b = $('banner'); b.textContent = msg || ''; b.hidden = !msg; }
  function status(msg) { $('status').textContent = msg || ''; }

  // ---------- rendering ----------
  function visibleTasks() {
    return S.tasks.filter((t) => S.filter === 'all' || t.focus === S.filter);
  }
  function sortTasks(list) {
    return list.slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || (PRIO_RANK[a.priority] ?? 1) - (PRIO_RANK[b.priority] ?? 1));
  }

  function renderHeader() {
    const open = S.tasks.filter((t) => t.column !== 'done');
    const todayN = S.tasks.filter((t) => t.column === 'today').length;
    const hi = open.filter((t) => t.priority === 'high').length;
    const d = new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
    $('sub').textContent = S.loaded.tasks
      ? `${d} · открыто ${open.length} · на сегодня ${todayN} · срочных ${hi}`
      : 'Загружаю задачи…';
  }

  function renderFilters() {
    const f = $('filters'); f.replaceChildren();
    const count = (id) => S.tasks.filter((t) => t.column !== 'done' && (id === 'all' || t.focus === id)).length;
    f.append(el('button', { class: 'chip', type: 'button', 'aria-pressed': String(S.filter === 'all'), onclick: () => { S.filter = 'all'; renderAll(); } }, 'Все фокусы', el('span', { class: 'n' }, count('all'))));
    for (const fo of S.focuses.slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0))) {
      f.append(el('button', { class: 'chip', type: 'button', 'aria-pressed': String(S.filter === fo.id), onclick: () => { S.filter = S.filter === fo.id ? 'all' : fo.id; renderAll(); } },
        el('span', { class: 'dot', style: `background:${COLORS[(fo.color ?? 0) % COLORS.length]}` }), fo.name, el('span', { class: 'n' }, count(fo.id))));
    }
  }

  function cardNode(t) {
    const fo = focusById(t.focus);
    const p = PRIO[t.priority] || PRIO.med;
    const node = el('button', { class: 'card' + (t.column === 'done' ? ' done' : ''), type: 'button', draggable: 'true', 'data-id': t.id, onclick: () => openEditor(t.id) },
      fo ? el('div', { class: 'labels' }, el('span', { class: 'label', style: `background:${COLORS[(fo.color ?? 0) % COLORS.length]}` }, fo.name)) : null,
      el('div', { class: 'title' }, t.title || 'Без названия'),
      el('div', { class: 'meta' },
        el('span', { class: 'prio', title: 'Приоритет' }, el('i', { style: `background:${p[1]}` }), p[0]),
        t.due ? el('span', { title: 'Срок' }, '⏱ ' + fmtDate(t.due)) : null,
        (t.tags || []).map((g) => el('span', { class: 'tag' }, g)),
        t.notes ? el('span', { title: 'Есть заметки' }, '≡') : null,
      ),
    );
    node.addEventListener('dragstart', (e) => { node.classList.add('dragging'); e.dataTransfer.setData('text/plain', t.id); e.dataTransfer.effectAllowed = 'move'; });
    node.addEventListener('dragend', () => node.classList.remove('dragging'));
    node.addEventListener('dragover', (e) => { e.preventDefault(); node.classList.add('over'); });
    node.addEventListener('dragleave', () => node.classList.remove('over'));
    node.addEventListener('drop', (e) => {
      e.preventDefault(); e.stopPropagation(); node.classList.remove('over');
      const id = e.dataTransfer.getData('text/plain'); if (id && id !== t.id) moveTask(id, t.column, t.id);
      document.querySelectorAll('.col.drop').forEach((c) => c.classList.remove('drop'));
    });
    return node;
  }

  function renderBoard() {
    const b = $('board'); const keepScroll = b.scrollLeft; b.replaceChildren();
    const vis = visibleTasks();
    for (const c of COLS) {
      const list = sortTasks(vis.filter((t) => (t.column || 'inbox') === c.id));
      const body = el('div', { class: 'col-body' });
      if (!list.length) body.append(el('div', { class: 'empty' }, S.loaded.tasks ? (c.id === 'inbox' ? 'Сюда падает всё новое. Накидай задачи в поле сверху.' : 'Пусто. Перетащи сюда карточку.') : 'Загрузка…'));
      for (const t of list) body.append(cardNode(t));
      const col = el('section', { class: 'col', 'aria-label': c.name },
        el('div', { class: 'col-head' }, el('h3', {}, c.name), el('span', { class: 'n' }, list.length)),
        body,
        el('button', { class: 'col-add', type: 'button', onclick: () => openEditor(null, c.id) }, '+ Добавить карточку'));
      col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drop'); });
      col.addEventListener('dragleave', (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove('drop'); });
      col.addEventListener('drop', (e) => { e.preventDefault(); col.classList.remove('drop'); const id = e.dataTransfer.getData('text/plain'); if (id) moveTask(id, c.id, null); });
      b.append(col);
    }
    b.scrollLeft = keepScroll;
  }

  function renderTray() {
    const tray = $('tray');
    tray.hidden = !S.preview.length;
    if (!S.preview.length) return;
    $('trayTitle').textContent = `Вот что получилось: ${S.preview.length}`;
    $('trayAdd').textContent = `Добавить ${S.preview.length}`;
    const list = $('trayList'); list.replaceChildren();
    S.preview.forEach((t, i) => {
      const fo = t.focus && t.focus.startsWith('new:') ? { name: t.focus.slice(4) + ' (новый)', color: S.focuses.length } : focusById(t.focus);
      const col = COLS.find((c) => c.id === t.column) || COLS[0];
      list.append(el('div', { class: 'tray-item' },
        el('button', { class: 'x', type: 'button', 'aria-label': 'Убрать', onclick: () => { S.preview.splice(i, 1); renderTray(); } }, '×'),
        el('div', { class: 'labels' }, fo ? el('span', { class: 'label', style: `background:${COLORS[(fo.color ?? 0) % COLORS.length]}` }, fo.name) : null),
        el('div', { class: 't' }, t.title),
        el('div', { class: 'm' }, `${col.name} · ${(PRIO[t.priority] || PRIO.med)[0].toLowerCase()} приоритет${t.due ? ' · до ' + fmtDate(t.due) : ''}${(t.tags || []).length ? ' · ' + t.tags.join(', ') : ''}`),
        t.notes ? el('div', { class: 'm' }, t.notes) : null));
    });
  }

  function renderAll() { renderHeader(); renderFilters(); renderBoard(); renderTray(); }

  // ---------- data ----------
  async function write(fn, okMsg) {
    if (!S.db) { banner('Доска открыта не в claude.ai — изменения некуда сохранить.'); return false; }
    try { await fn(); if (okMsg) toast(okMsg); return true; }
    catch (e) { toast('Не сохранилось: ' + (e?.message || e?.code || 'ошибка') + '. Попробуй ещё раз.'); return false; }
  }

  function moveTask(id, column, beforeId) {
    const t = S.tasks.find((x) => x.id === id); if (!t) return;
    const colList = sortTasks(S.tasks.filter((x) => (x.column || 'inbox') === column && x.id !== id));
    let order;
    if (beforeId) {
      const idx = colList.findIndex((x) => x.id === beforeId);
      const prev = colList[idx - 1]; const next = colList[idx];
      order = prev ? ((prev.order ?? 0) + (next.order ?? 0)) / 2 : (next.order ?? 0) - 1;
    } else {
      order = colList.length ? (colList[colList.length - 1].order ?? 0) + 1 : 0;
    }
    const patch = { column, order, updatedAt: Date.now() };
    if (column === 'done' && t.column !== 'done') patch.doneAt = Date.now();
    Object.assign(t, patch); renderAll();
    write(() => S.db.collection('tasks').doc(id).update(patch));
  }

  async function ensureFocus(spec) {
    if (!spec) return 'other';
    if (!spec.startsWith('new:')) return focusById(spec) ? spec : 'other';
    const name = spec.slice(4).trim() || 'Прочее';
    const existing = S.focuses.find((f) => f.name.toLowerCase() === name.toLowerCase());
    if (existing) return existing.id;
    const id = uid('f');
    const data = { name, color: S.focuses.length % COLORS.length, order: S.focuses.length };
    S.focuses.push({ id, ...data });
    await S.db.collection('focuses').doc(id).set(data);
    return id;
  }

  async function addPreview() {
    if (!S.preview.length) return;
    const items = S.preview.slice(); const sessions = S.previewSessions.slice();
    $('trayAdd').disabled = true;
    const ok = await write(async () => {
      let base = Date.now();
      for (const t of items) {
        const focus = await ensureFocus(t.focus);
        const id = uid('t');
        await S.db.collection('tasks').doc(id).set({
          title: String(t.title).slice(0, 200), focus, column: COLS.some((c) => c.id === t.column) ? t.column : 'inbox',
          priority: PRIO[t.priority] ? t.priority : 'med', tags: Array.isArray(t.tags) ? t.tags.slice(0, 5).map(String) : [],
          notes: t.notes ? String(t.notes) : '', due: t.due || null, source: t.source || 'Накидал вручную',
          order: base++, createdAt: Date.now(), updatedAt: Date.now(),
        });
      }
      if (sessions.length) await markSessions(sessions);
    }, `Добавил ${items.length}`);
    $('trayAdd').disabled = false;
    if (ok) { S.preview = []; S.previewSessions = []; $('dump').value = ''; renderAll(); }
  }

  async function markSessions(ids) {
    const ref = S.db.doc('meta/slack');
    const snap = await ref.get();
    const prev = (snap.exists && snap.data()?.processed) || [];
    await ref.set({ processed: Array.from(new Set([...prev, ...ids])).slice(-500), lastSync: Date.now() });
  }

  // ---------- Claude parsing ----------
  function parsePrompt(text, sourceHint) {
    const focuses = S.focuses.map((f) => ({ id: f.id, name: f.name }));
    const existing = S.tasks.filter((t) => t.column !== 'done').map((t) => t.title).slice(0, 120);
    return `Ты ведёшь трекер задач продакт-менеджера Карима (мобильное приложение; занимается ревью и рейтингами в App Store, Google Play и Trustpilot, аналитикой, ресерчем новых продуктов). Сегодня ${today()}.

Разбери текст ниже на отдельные конкретные задачи. Правила:
- Заголовок: короткое действие по-русски, начинается с глагола, до 90 символов. Сохраняй термины. Сокращения: ТП = Trustpilot, АС = App Store, ТС = Trustpilot, ПРД = PRD.
- focus: id одного из существующих фокусов, либо "new:Название", если ни один не подходит (создавай новый фокус только для явно новой темы). Существующие фокусы: ${JSON.stringify(focuses)}
- column: "today" если сказано сегодня/срочно/горит; "waiting" если ждём кого-то или чей-то ответ/доступ; "doing" если уже в процессе; "done" если сказано, что сделано; иначе "inbox".
- priority: "high" | "med" | "low".
- tags: 0–3 коротких тега из платформ и людей (iOS, Android, App Store, Trustpilot, Google Play, имя человека).
- notes: контекст, факты и инсайты из текста, которые относятся к задаче (может быть пустой строкой). Факты без действия не делай отдельными задачами, а клади в notes ближайшей задачи.
- due: "YYYY-MM-DD", если назван срок, иначе null.
- Не дублируй задачи, которые уже есть на доске: ${JSON.stringify(existing)}
${sourceHint ? '- Источник текста: ' + sourceHint + '. Это переписка; бери только задачи и договорённости Карима, игнорируй служебные сообщения бота.' : ''}

Ответь только JSON вида {"tasks":[{"title":"...","focus":"...","column":"inbox","priority":"med","tags":[],"notes":"","due":null}]}. Если задач нет, верни {"tasks":[]}.

Текст:
"""
${text}
"""`;
  }

  async function parseText(text, sourceHint) {
    if (!S.sample) throw { code: 'no_sample' };
    const out = await S.sample.json(parsePrompt(text, sourceHint), { modelTier: 'default', cache: false });
    const arr = Array.isArray(out) ? out : Array.isArray(out?.tasks) ? out.tasks : [];
    return arr.filter((t) => t && typeof t.title === 'string' && t.title.trim());
  }

  function fallbackParse(text) {
    return text.split(/\n|;|•/).map((s) => s.replace(/^[\s\-*\d.)]+/, '').trim()).filter((s) => s.length > 2)
      .map((title) => ({ title, focus: 'other', column: 'inbox', priority: 'med', tags: [], notes: '' }));
  }

  async function onParse() {
    const text = $('dump').value.trim(); if (!text || S.busy) return;
    S.busy = true; $('parseBtn').disabled = true; status('Claude разбирает…');
    try {
      const items = await parseText(text);
      items.forEach((t) => (t.source = 'Накидал ' + new Date().toLocaleDateString('ru-RU')));
      S.preview = items; S.previewSessions = [];
      status(items.length ? '' : 'Задач не нашёл. Попробуй написать подробнее.');
    } catch (e) {
      if (e?.code === 'no_sample' || e?.code === 'not_granted') {
        S.preview = fallbackParse(text).map((t) => ({ ...t, source: 'Накидал вручную' }));
        status('Claude недоступен: разбил по строкам во «Входящие».');
      } else if (e?.code === 'rate_limited') status('Слишком часто. Подожди минуту.');
      else status('Не получилось разобрать: ' + (e?.message || 'ошибка'));
    } finally { S.busy = false; $('parseBtn').disabled = false; renderTray(); }
  }

  // ---------- Slack sync (through Claude-in-Slack sessions) ----------
  function payloadOf(res) {
    let p = res?.payload;
    if (p === undefined) { const txt = res?.content?.find?.((c) => c.type === 'text')?.text; p = txt; }
    if (typeof p === 'string') { try { p = JSON.parse(p); } catch { const m = p.match(/\{[\s\S]*\}/); try { p = m ? JSON.parse(m[0]) : null; } catch { p = null; } } }
    return p;
  }
  const dataArr = (p) => (Array.isArray(p) ? p : p?.ccr?.data || p?.data || p?.sessions || p?.events || []);

  async function onSync() {
    if (S.busy) return;
    const c = window.claude;
    const mcp = c ? await c.use('mcp') : null;
    if (!mcp) { toast('Подтянуть из Slack можно только в claude.ai с подключённым Claude Code.'); return; }
    if (!S.sample) { toast('Нужен доступ к Claude, чтобы разобрать сообщения.'); return; }
    S.busy = true; $('syncBtn').disabled = true; status('Читаю Slack…');
    try {
      const metaSnap = await S.db.doc('meta/slack').get();
      const done = new Set((metaSnap.exists && metaSnap.data()?.processed) || []);
      const sres = await mcp.callTool(SLACK_SERVER, 'list_sessions', { limit: 50 });
      const sessions = dataArr(payloadOf(sres)).filter((s) => s && s.origin === 'claude_in_slack' && !done.has(s.id)).slice(0, 8);
      if (!sessions.length) { status('В Slack ничего нового.'); return; }
      const all = []; const ids = [];
      for (const s of sessions) {
        status(`Читаю: ${s.title || s.id}…`);
        const eres = await mcp.callTool(SLACK_SERVER, 'list_events', { session_id: s.id, kinds: ['user'], limit: 100 });
        const texts = dataArr(payloadOf(eres))
          .map((e) => e?.user?.internal_anthropic_catchall)
          .filter((u) => u && u.inbound_origin === 'slack_human' && typeof u.message?.content === 'string')
          .map((u) => u.message.content.replace(/IMPORTANT:[^\n]*\n?/g, '').replace(/NOTE:[^\n]*\n?/g, ''));
        ids.push(s.id);
        if (!texts.length) continue;
        status(`Разбираю: ${s.title || s.id}…`);
        const day = (s.created_at || '').slice(0, 10);
        const items = await parseText(texts.join('\n\n---\n\n').slice(0, 24000), `Slack #claude-me, ${day}`);
        items.forEach((t) => (t.source = `Slack · ${day}`));
        all.push(...items);
      }
      S.preview = all; S.previewSessions = ids;
      if (!all.length) { await markSessions(ids); status('Новых задач в Slack нет.'); }
      else status('');
    } catch (e) {
      const code = e?.code;
      status(code === 'not_granted' || code === 'consent_denied' ? 'Нет доступа к Claude Code — разреши его в Permissions.' : 'Не удалось прочитать Slack: ' + (e?.message || code || 'ошибка'));
    } finally { S.busy = false; $('syncBtn').disabled = false; renderTray(); }
  }

  // ---------- editor ----------
  function openEditor(id, column) {
    const t = id ? S.tasks.find((x) => x.id === id) : { title: '', focus: S.filter !== 'all' ? S.filter : (S.focuses[0]?.id || 'other'), column: column || 'inbox', priority: 'med', tags: [], notes: '', due: null };
    if (!t) return;
    const scrim = $('scrim'); scrim.replaceChildren();
    const fSel = el('select', { id: 'edFocus' },
      S.focuses.slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0)).map((f) => el('option', { value: f.id, selected: f.id === t.focus }, f.name)),
      el('option', { value: '__new' }, '+ Новый фокус…'));
    const newFocus = el('input', { id: 'edNewFocus', placeholder: 'Название фокуса', hidden: true });
    fSel.addEventListener('change', () => { newFocus.hidden = fSel.value !== '__new'; if (!newFocus.hidden) newFocus.focus(); });
    const title = el('input', { id: 'edTitle', value: t.title || '' });
    const notes = el('textarea', { id: 'edNotes' }); notes.value = t.notes || '';
    const colSel = el('select', { id: 'edCol' }, COLS.map((c) => el('option', { value: c.id, selected: c.id === (t.column || 'inbox') }, c.name)));
    const pSel = el('select', { id: 'edPrio' }, Object.entries(PRIO).map(([k, v]) => el('option', { value: k, selected: k === t.priority }, v[0])));
    const tags = el('input', { id: 'edTags', value: (t.tags || []).join(', '), placeholder: 'iOS, Trustpilot' });
    const due = el('input', { id: 'edDue', type: 'date', value: t.due || '' });
    const del = el('button', { class: 'btn danger', type: 'button' }, 'Удалить');
    del.addEventListener('click', async () => {
      if (!del.classList.contains('armed')) { del.classList.add('armed'); del.textContent = 'Точно удалить?'; return; }
      close(); S.tasks = S.tasks.filter((x) => x.id !== id); renderAll();
      write(() => S.db.collection('tasks').doc(id).delete(), 'Удалил');
    });
    const save = async () => {
      if (!title.value.trim()) { title.focus(); return; }
      let focus = fSel.value;
      if (focus === '__new') focus = 'new:' + (newFocus.value.trim() || 'Прочее');
      const data = { title: title.value.trim(), notes: notes.value.trim(), column: colSel.value, priority: pSel.value,
        tags: tags.value.split(',').map((s) => s.trim()).filter(Boolean).slice(0, 5), due: due.value || null, updatedAt: Date.now() };
      close();
      await write(async () => {
        data.focus = await ensureFocus(focus);
        if (id) {
          const old = S.tasks.find((x) => x.id === id);
          if (old && old.column !== data.column) data.order = Date.now();
          if (data.column === 'done' && old?.column !== 'done') data.doneAt = Date.now();
          await S.db.collection('tasks').doc(id).update(data);
        } else {
          await S.db.collection('tasks').doc(uid('t')).set({ ...data, source: 'Добавил вручную', order: Date.now(), createdAt: Date.now() });
        }
      }, id ? 'Сохранил' : 'Добавил');
    };
    const modal = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'edHead' },
      el('h2', { id: 'edHead' }, id ? 'Карточка' : 'Новая карточка'),
      el('label', { class: 'field' }, el('span', {}, 'Задача'), title),
      el('div', { class: 'grid2' },
        el('label', { class: 'field' }, el('span', {}, 'Фокус'), fSel, newFocus),
        el('label', { class: 'field' }, el('span', {}, 'Колонка'), colSel),
        el('label', { class: 'field' }, el('span', {}, 'Приоритет'), pSel),
        el('label', { class: 'field' }, el('span', {}, 'Срок'), due)),
      el('label', { class: 'field' }, el('span', {}, 'Теги через запятую'), tags),
      el('label', { class: 'field' }, el('span', {}, 'Заметки и контекст'), notes),
      t.source ? el('div', { class: 'src-line' }, 'Источник: ' + t.source) : null,
      el('div', { class: 'modal-actions' },
        id ? del : el('span'),
        el('div', { style: 'display:flex;gap:8px' },
          el('button', { class: 'btn', type: 'button', onclick: () => close() }, 'Закрыть'),
          el('button', { class: 'btn primary', type: 'button', onclick: save }, 'Сохранить'))));
    scrim.append(modal); scrim.hidden = false; title.focus();
    function close() { scrim.hidden = true; scrim.replaceChildren(); document.removeEventListener('keydown', onKey); }
    function onKey(e) { if (e.key === 'Escape') close(); if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) save(); }
    document.addEventListener('keydown', onKey);
    scrim.onclick = (e) => { if (e.target === scrim) close(); };
  }

  // ---------- boot ----------
  $('parseBtn').addEventListener('click', onParse);
  $('dump').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) onParse(); });
  $('trayAdd').addEventListener('click', addPreview);
  $('trayCancel').addEventListener('click', async () => {
    const ids = S.previewSessions.slice(); S.preview = []; S.previewSessions = []; renderTray();
    if (ids.length && S.db) write(() => markSessions(ids));
  });
  $('syncBtn').addEventListener('click', onSync);
  renderAll();

  (async () => {
    const c = window.claude;
    if (!c) { banner('Открой доску в claude.ai — задачи хранятся там.'); return; }
    const timer = setTimeout(() => { if (!S.loaded.tasks) banner('Задачи долго не грузятся. Проверь, что ты вошёл в claude.ai.'); }, 10000);
    const db = await c.use('db');
    if (!db) { clearTimeout(timer); banner('Нет доступа к хранилищу задач. Войди в claude.ai и открой доску снова.'); return; }
    S.db = db;
    db.collection('focuses').onSnapshot((snap) => {
      S.focuses = snap.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.focuses = true; renderAll();
    }, (e) => banner('Фокусы не загрузились: ' + (e?.message || e?.code)));
    db.collection('tasks').onSnapshot((snap) => {
      clearTimeout(timer); banner('');
      S.tasks = snap.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.tasks = true; renderAll();
    }, (e) => { clearTimeout(timer); banner('Задачи не загрузились: ' + (e?.message || e?.code)); });
    c.use('sample').then((s) => { S.sample = s; });
  })();
})();
</script>
